name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Ruff
        run: ruff check tests

      - name: Mypy
        run: mypy src/concierge/server/auth.py src/concierge/server/facade.py src/concierge/server/admin.py src/concierge/policy src/concierge/errors.py src/concierge/config.py

      - name: Bandit
        run: bandit -r src/concierge -ll

      - name: pip-audit
        run: pip-audit

      - name: Pytest with coverage gate
        run: pytest --cov=concierge --cov-report=term-missing --cov-fail-under=80 -q
