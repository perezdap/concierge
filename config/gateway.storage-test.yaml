# Verification config: persistent shared state (P1-2) + echo upstream only.
gateway:
  host: 127.0.0.1
  port: 8766
  bind_public: false
  path: /mcp
  allowed_origins:
    - http://localhost
    - http://127.0.0.1

auth:
  type: localhost
  bearer_tokens: []

log_level: INFO

storage:
  catalog_store: postgres
  catalog_postgres_url: "postgresql://postgres:concierge@localhost:5432/concierge"
  session_store: redis
  redis_url: "redis://localhost:6379/0"

upstream_servers:
  - id: echo
    transport: stdio
    command: ["python", "examples/upstream_echo_server.py"]
    default_risk: low

profiles:
  - name: demo-echo
    description: "Just the echo upstream."
    auto_apply: true
    selectors:
      - server: echo
