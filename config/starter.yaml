# Starter config — boot with no upstreams, manage everything via the admin panel.
#
# Usage:
#   python -m concierge init               # generate GATEWAY_TOKEN in .env (first run)
#   python -m concierge --config config/starter.yaml
#   open http://localhost:8765/admin
#
# Add upstreams and profiles in the admin panel; click "Apply" to reload live.
# The YAML file never needs to change — the admin panel writes to the runtime
# config store, not back to this file.
#
# When you want bearer-token auth (e.g. exposing to other machines or CI), switch:
#   auth:
#     type: bearer
#     bearer_tokens: ["${GATEWAY_TOKEN}"]
# Your token is in .env (auto-generated by `concierge init`).

gateway:
  host: 127.0.0.1
  port: 8765

auth:
  type: localhost

log_level: INFO
