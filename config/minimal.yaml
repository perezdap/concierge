# Echo-server demo — quick smoke test with one built-in upstream (local Python only).
#
# Usage:
#   python -m concierge --config config/minimal.yaml
#
# For admin-panel-first local dev, use config/starter.yaml.
# For Docker, use config/starter.docker.yaml (docker compose uses it by default).

gateway:
  host: 127.0.0.1
  port: 8765

auth:
  type: none

log_level: INFO

session_pool:
  idle_ttl_s: 3600
  gc_interval_s: 60
  max_upstream_sessions: 64

payload:
  slim_tools_list: true
  max_schema_description_chars: 120
  drop_schema_examples: true

policy:
  rate_limit_capacity: 50
  rate_limit_refill_per_sec: 1.0
  block_dangerous_without_approval: false

upstream_servers:
  - id: echo
    transport: stdio
    command: ["python", "examples/upstream_echo_server.py"]
    default_risk: low
    default_tags: ["demo"]
    default_categories: ["utility"]
