# Example Concierge configuration.
# Run: python -m concierge --config config/gateway.example.yaml

gateway:
  host: 127.0.0.1
  port: 8765
  bind_public: false
  path: /mcp
  allowed_origins:
    - http://localhost
    - http://127.0.0.1

auth:
  # 'localhost' = allow only loopback. Other options: 'none' | 'bearer'.
  type: localhost
  bearer_tokens: []

log_level: INFO
catalog_refresh_interval_s: 300

# Router-session lifecycle + per-session upstream connection pool.
session_pool:
  idle_ttl_s: 3600            # idle router sessions GC'd after this many seconds
  gc_interval_s: 60           # how often the GC sweep runs
  max_upstream_sessions: 256  # global cap on pooled per_session upstream sessions (LRU)

# Outbound payload trimming toward downstream LLM clients (token reduction).
payload:
  slim_tools_list: false           # opt-in: slim published-tool input schemas in tools/list
  max_schema_description_chars: 160 # cap inline schema descriptions on that surface
  drop_schema_examples: true       # drop verbose examples/$comment from schemas
  max_result_bytes: 0              # 0 = never truncate tool results; >0 caps text blocks

policy:
  rate_limit_capacity: 30
  rate_limit_refill_per_sec: 0.5
  block_dangerous_without_approval: true

upstream_servers:
  # --- 1. local stdio MCP server (filesystem-style) ---
  - id: echo
    transport: stdio
    command: ["python", "examples/upstream_echo_server.py"]
    default_risk: low
    default_tags: ["demo", "echo"]
    default_categories: ["utility"]

  # --- 2. remote Streamable HTTP MCP server ---
  - id: notes
    transport: streamable_http
    url: https://notes.example.internal/mcp
    headers:
      Authorization: "Bearer ${NOTES_TOKEN}"   # operator substitutes via env-templating
    default_risk: medium
    default_tags: ["notes"]
    default_categories: ["productivity"]
    requires_auth: true
    # Isolate upstream sessions per router session (good for multi-tenant HTTP).
    # Default is "shared" (one upstream session for all router sessions).
    isolation: per_session
    connect_max_retries: 3        # retry transient connects with backoff + jitter
    connect_backoff_base_s: 0.5
    connect_backoff_max_s: 10.0

  # --- 3. legacy HTTP+SSE MCP server ---
  - id: legacy-jira
    transport: sse_legacy
    sse_url: https://jira.example.internal/mcp/sse
    headers:
      Authorization: "Bearer ${JIRA_TOKEN}"
    default_risk: high
    default_tags: ["jira"]
    default_categories: ["ticketing"]
    requires_approval_for:
      - delete_issue
      - transition_issue

  # --- 4. custom adapter placeholder ---
  # - id: my-custom
  #   transport: custom
  #   custom_kind: my-wire
  #   custom_params: { endpoint: tcp://10.0.0.5:7000 }

profiles:
  - name: demo-echo
    description: "Just the echo upstream."
    selectors:
      - server: echo

  - name: github-review
    description: "Read-only GitHub review tooling."
    selectors:
      - server: github
        tags: ["read"]
        primitive_type: tool

  - name: network-admin
    description: "UniFi + DNS read/write."
    selectors:
      - server: unifi
      - tags: ["dns"]
