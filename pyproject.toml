[project]
name = "concierge"
version = "0.1.0"
description = "Brokered, session-scoped capability router for MCP servers."
requires-python = ">=3.11"
authors = [{ name = "Infra" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "anyio>=4.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2",
]

[project.scripts]
concierge = "concierge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that spawn a real stdio upstream (optional in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["concierge"]
mypy_path = "src"
ignore_missing_imports = true
warn_return_any = false
check_untyped_defs = false

[tool.coverage.run]
source = ["concierge"]

[tool.coverage.report]
fail_under = 80
show_missing = true
omit = [
    "*/__main__.py",
    "*/adapters/custom.py",
]
