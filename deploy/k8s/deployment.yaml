apiVersion: apps/v1
kind: Deployment
metadata:
  name: concierge-gateway
  labels:
    app.kubernetes.io/name: concierge
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: concierge
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: concierge
        app.kubernetes.io/component: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: concierge:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["concierge"]
          args: ["--config", "/etc/concierge/gateway.yaml"]
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: INFO
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/concierge
              readOnly: true
      volumes:
        - name: gateway-config
          configMap:
            name: concierge-gateway-config
