# Standalone nginx reverse proxy terminating TLS in front of Concierge (P1-7).
#
# TLS terminates here; nginx talks plain HTTP to the gateway on 8765. Certificate
# and key are read from disk paths that you populate from a secret manager at
# deploy time (e.g. mounted by your orchestrator or fetched by an init script) —
# never commit cert/key material to git.
#
# Usage (Docker): mount this file at /etc/nginx/conf.d/concierge.conf and mount
# the certs read-only; point `proxy_pass` at the gateway container/service.

upstream concierge_gateway {
    server 127.0.0.1:8765;
    keepalive 32;
}

server {
    listen 80;
    server_name concierge.example.com;
    # Redirect all plaintext traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name concierge.example.com;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # MCP streamable HTTP opens long-lived SSE GET streams; disable buffering and
    # raise read timeouts so notifications are not held back or cut off.
    location / {
        proxy_pass         http://concierge_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health/readiness endpoints (P1-6) — useful for an external LB health check.
    location = /healthz {
        proxy_pass http://concierge_gateway/healthz;
    }
    location = /readyz {
        proxy_pass http://concierge_gateway/readyz;
    }
}
