services:
  concierge:
    build:
      context: .
      dockerfile: Dockerfile
    image: concierge:0.1.0
    ports:
      - "8765:8765"
    command: ["--config", "config/gateway.example.yaml"]
    environment:
      LOG_LEVEL: INFO
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz')",
        ]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped
