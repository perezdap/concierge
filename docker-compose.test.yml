# Backing services for P1-2 integration tests (Redis sessions + Postgres catalog).
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   CONCIERGE_TEST_PG_DSN=postgresql://postgres:concierge@localhost:5432/concierge \
#     pytest -q
#   docker compose -f docker-compose.test.yml down
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: concierge
      POSTGRES_DB: concierge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 10
